<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--ink:#0f0f0f;--muted:#606060;--line:#e5e5e5;--chip:#f2f2f2;--chip2:#e5e5e5;--accent:#1f5d50;--link:#065fd4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--ink:#f1f1f1;--muted:#aaa;--line:#3f3f3f;--chip:#272727;--chip2:#3f3f3f;--accent:#6cc4a8;--link:#3ea6ff}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Roboto,Arial,system-ui,sans-serif;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
html{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;display:grid;grid-template-columns:1fr minmax(0,640px) 1fr;align-items:center;gap:16px;padding:0 16px;background:var(--bg)}
.hl{display:flex;align-items:center;gap:8px}
.icon{width:40px;height:40px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.icon:hover,.sbtn:hover{background:var(--chip)}
.logo{font-size:26px;font-weight:800;letter-spacing:-.03em;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px 6px 11px 11px;background:var(--accent);display:inline-block}
.search{display:flex;height:40px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-right:0;border-radius:40px 0 0 40px;background:var(--bg);padding:0 16px;outline-offset:-1px}
.search button{width:64px;border:1px solid var(--line);border-radius:0 40px 40px 0;background:var(--chip);display:grid;place-items:center}
.search button:hover{background:var(--chip2)}
aside{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));bottom:0;left:0;width:240px;padding:12px;overflow-y:auto;background:var(--bg)}
.sbtn{display:flex;align-items:center;gap:20px;width:100%;border:0;background:none;border-radius:10px;padding:0 12px;height:40px;text-align:left;font-size:14px}
.sbtn.active{background:var(--chip);font-weight:500}
.sbtn svg{flex-shrink:0}
aside h3{font-size:16px;font-weight:500;padding:12px 12px 6px;border-top:1px solid var(--line);margin-top:12px}
.sbtn .av{width:24px;height:24px;font-size:12px}
.sbtn span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{margin-left:240px;padding:0 24px 60px}
body.noside aside{display:none}body.noside main{margin-left:0}
body.watching aside{display:none}body.watching main{margin-left:0}
body.watching.drawer aside{display:block;z-index:40;box-shadow:0 4px 32px rgba(0,0,0,.3)}
#scrim{display:none;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.4)}
body.watching.drawer #scrim{display:block}
#watch{padding-top:24px}
.chips{display:flex;gap:12px;overflow-x:auto;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:12px 0;margin-bottom:12px}
.chip{border:0;background:var(--chip);padding:0 12px;height:32px;border-radius:8px;white-space:nowrap;font-size:14px;font-weight:500}
.chip:hover{background:var(--chip2)}
.chip.active{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 16px}
.card{display:block}
.thumb{display:block;width:100%;border:0;padding:0;position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--chip)}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;gap:12px;margin-top:12px}
.avbtn{background:none;border:0;padding:0;height:36px;flex-shrink:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-weight:500;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.title{display:block;background:none;border:0;padding:0;text-align:left;font-size:16px;font-weight:500;line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chan{background:none;border:0;padding:0;color:var(--muted);font-size:14px;text-align:left}
.chan:hover{color:var(--ink)}
.byline{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;color:var(--muted);font-size:14px}
.sub{color:var(--muted);font-size:14px}
.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:var(--muted)}
.chhead{display:flex;gap:24px;align-items:center;padding:24px 0}
.chhead .av{width:128px;height:128px;font-size:52px}
.chhead h1{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.chdesc{margin-top:8px;max-width:70ch;white-space:pre-wrap;color:var(--muted);font-size:14px}
.tabs{border-bottom:1px solid var(--line);margin-bottom:24px}
.shelfh{font-size:20px;font-weight:700;line-height:1.3;margin:0 0 16px}
.shelf{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;margin-bottom:28px}
.scard{width:240px;flex-shrink:0}
.scard .title{font-size:14px;margin:8px 0 2px}
.tabs{display:flex}
.tab{background:none;border:0;padding:12px 16px;font-weight:500;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.grid .scard{width:auto}
.grid .scard .title{font-size:16px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 16px}
.grid.sm .scard .title{font-size:14px}
.scard.lg{width:400px}
.scard.lg .title{font-size:16px}
.results{display:flex;flex-direction:column;gap:16px;max-width:1100px;margin:0 auto}
.chrows{max-width:1100px;margin:16px auto 8px;border-bottom:1px solid var(--line);padding-bottom:8px}
.chrow{display:flex;gap:24px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:16px 0}
.chrow .av{width:120px;height:120px;font-size:48px;margin:0 28px}
.chrow .txt>*{display:block}.chrow b{font-size:18px;font-weight:400}
.res{display:flex;gap:16px}
.res .thumb{width:360px;flex-shrink:0}
.res .title{font-size:18px}
.res .rtxt{min-width:0}
.res .byline{margin-bottom:12px}
.res .cl{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;margin-bottom:12px;color:var(--muted);font-size:14px}
.res .cl .av{width:24px;height:24px;font-size:12px}
.res p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrap{display:flex;gap:24px;align-items:flex-start;max-width:1700px;margin:0 auto}
.primary{flex:1;min-width:0}
.secondary{width:402px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
#player{width:100%;max-height:75vh;background:#000;border-radius:12px;display:block}
.primary h1{font-size:20px;font-weight:700;line-height:1.4;margin:12px 0}
.wrow{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.wrow .chan{color:var(--ink);font-size:16px;font-weight:500;display:block}
.desc{background:var(--chip);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.desc b{display:block;margin-bottom:4px}
.mini{display:flex;gap:8px}
.mini .thumb{width:168px;flex-shrink:0;border-radius:8px}
.mini .title{font-size:14px;margin-bottom:2px}
.mini .byline{display:block}.mini .byline span{margin-right:4px}
.hr{display:flex;justify-content:flex-end;position:relative}
.pop{position:absolute;top:48px;right:0;width:310px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 32px rgba(0,0,0,.2);padding:8px 0;z-index:30}
.poph{padding:8px 16px 10px;font-weight:500;border-bottom:1px solid var(--line);margin-bottom:4px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:10px 16px;background:none;border:0;text-align:left;font-size:14px}
.prow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
button.prow:hover:not(:disabled){background:var(--chip)}
button.prow:disabled{opacity:.5;cursor:default}
.sw{appearance:none;-webkit-appearance:none;width:36px;height:14px;border-radius:7px;background:var(--chip2);position:relative;flex-shrink:0;cursor:pointer}
.sw:before{content:"";position:absolute;left:0;top:-3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s}
.sw:checked{background:var(--accent);opacity:1}
.sw:checked:before{transform:translateX(16px)}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:12px}
.desc b,#wDesc{display:block}
.desc.closed{cursor:pointer}
.desc.closed #wDesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.closed .tags{display:none}
.more{display:block;background:none;border:0;padding:0;margin-top:6px;font-weight:700;font-size:14px}
.desc .tags{margin-top:10px}
.tags:empty{display:none}
.tag{background:none;border:0;padding:0;color:var(--link);font-size:14px;font-weight:500}
.tag:hover{text-decoration:underline}
/* snacks */
.sncard{width:180px;flex-shrink:0}
.snthumb{display:block;width:100%;aspect-ratio:9/16;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--chip);position:relative}
.snthumb img{width:100%;height:100%;object-fit:cover;display:block}
.snph{display:grid;place-items:center;height:100%;padding:12px;text-align:center;font-weight:500;font-size:14px}
.sncard .title{font-size:14px;margin:8px 0 2px}
.grid .sncard{width:auto}
.grid.sg{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
body.snacking{overflow:hidden}
body.snacking main{padding:0}
#snacks{position:relative}
#feed{height:calc(100vh - 56px - env(safe-area-inset-top,0px));height:calc(100dvh - 56px - env(safe-area-inset-top,0px));overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.snack{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:12px 0}
.frame{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;background:#000;border-radius:12px;overflow:hidden;color:#fff}
.frame video{width:100%;height:100%;object-fit:contain;display:block}
.snmute{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.snpause{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .15s}
.snpause span{width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.snack.paused .snpause{opacity:1}
.snmeta{position:absolute;left:0;right:0;bottom:0;padding:56px 14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.snrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.snrow .av{width:32px;height:32px;font-size:14px}
.snrow .chan{color:#fff;font-weight:500}
.snrow span{opacity:.8}
.sntitle{font-weight:500;font-size:15px;margin-bottom:2px}
.sndesc{font-size:13px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sntags{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:6px}
.sntags .tag{color:#fff;font-size:13px}
.snbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}
.snbar i{display:block;height:100%;width:0;background:#fff}
.snnav{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.snnav .icon{background:var(--chip)}
.snnav .icon:hover{background:var(--chip2)}
#bottom .shelfh{margin-top:32px}
.hidden{display:none!important}
@media (max-width:1000px){.wrap{flex-direction:column;align-items:stretch}.secondary{width:100%}}
#sicon,#sback,#bnav{display:none}
@media (max-width:900px){
 aside,#menu,#scrim{display:none!important}
 /* header: logo on the left, search + settings on the right; search opens as a full-width bar */
 header{display:flex;justify-content:space-between;gap:0;padding:0 4px 0 12px}
 .logo{font-size:22px}
 .search{display:none}
 #sicon{display:grid}
 body.msearch .hl,body.msearch .hr{display:none}
 body.msearch header{padding:0 8px 0 4px}
 body.msearch .search{display:flex;flex:1;min-width:0}
 body.msearch #sback{display:grid;flex-shrink:0}
 body.msearch #bnav{display:none}
 body.watching header{display:none}
 /* settings becomes a bottom sheet */
 .pop{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;border:0;border-radius:16px 16px 0 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:0 -6px 32px rgba(0,0,0,.35)}
 /* bottom tab bar */
 #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
 .bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;padding:0;background:none;border:0;font-size:10px;color:var(--ink)}
 .bn.active{font-weight:700}
 .bn .on{display:none}
 .bn.active .on{display:block}
 .bn.active .off{display:none}
 /* feed: one column, edge-to-edge thumbnails */
 main{margin-left:0;padding:0 0 calc(72px + env(safe-area-inset-bottom,0px))}
 .chips{padding:8px 12px;margin-bottom:8px;gap:8px}
 .grid,.grid.sm{grid-template-columns:1fr;gap:20px}
 .thumb,.mini .thumb{border-radius:0}
 .meta{padding:0 12px}
 .title{font-size:15px}
 .scard .title,.scard .byline{padding:0 12px}
 .results{gap:20px}
 .res{gap:0}
 .res .thumb{width:100%}
 .res .rtxt{padding:8px 12px 0}
 .res .byline{margin-bottom:8px}
 .res .title{font-size:16px}
 .empty{padding:60px 16px}
 /* channels */
 .shelfh{padding:0 12px;font-size:18px}
 .shelf{padding:0 12px 4px}
 .shelf .thumb{border-radius:12px}
 .shelf .scard .title,.shelf .scard .byline{padding:0}
 .scard.lg{width:280px}
 .chhead{flex-direction:column;text-align:center;gap:12px;padding:16px 12px}
 .chhead .av{width:80px;height:80px;font-size:34px}
 .chhead h1{font-size:24px}
 .chdesc{margin:8px auto 0}
 .tabs{overflow-x:auto;padding:0 4px;margin-bottom:16px}
 .chrows{margin:0;padding-bottom:0}
 .chrow{padding:12px;gap:12px}
 .chrow .av{width:64px;height:64px;margin:0;font-size:26px}
 .chrow b{font-size:16px}
 body.snacking header{display:none}
 #feed{height:calc(100vh - 57px - env(safe-area-inset-bottom,0px));height:calc(100dvh - 57px - env(safe-area-inset-bottom,0px))}
 .snack{padding:0}
 .frame{width:100%;aspect-ratio:auto;border-radius:0}
 .snnav{display:none}
 .grid.sg{grid-template-columns:repeat(2,1fr);gap:16px 8px;padding:0 12px}
 .shelf .sncard{width:150px}
 /* video page: the player stays pinned at the top while everything else scrolls */
 #watch{padding-top:0}
 .wrap{gap:0}
 .primary{display:contents}
 #player{position:sticky;top:0;z-index:15;width:100%;aspect-ratio:16/9;max-height:none;border-radius:0}
 .primary h1{font-size:18px;margin:8px 12px}
 .wrow{padding:0 12px;margin:4px 0 12px}
 .desc{margin:0 12px}
 .secondary{padding-top:20px;gap:20px}
 .mini{flex-direction:column;gap:0}
 .mini>div{padding:8px 12px 0}
 .mini .byline{display:flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hl">
    <button class="icon" id="menu" aria-label="Toggle menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M21 6H3V5h18v1zm0 5H3v1h18v-1zm0 6H3v1h18v-1z"/></svg></button>
    <button class="logo" id="logo" aria-label="Pantry home"><i></i>Pantry</button>
  </div>
  <div class="search">
    <button class="icon" id="sback" aria-label="Close search"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 11H7.83l5.58-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <input id="q" type="search" placeholder="Search" aria-label="Search">
    <button id="sbtn" aria-label="Search"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20.87 20.17l-5.59-5.59A6.96 6.96 0 0 0 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.66 0 3.18-.58 4.38-1.54l5.59 5.59.9-.88zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg></button>
  </div>
  <div class="hr">
    <button class="icon" id="sicon" aria-label="Search"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20.87 20.17l-5.59-5.59A6.96 6.96 0 0 0 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.66 0 3.18-.58 4.38-1.54l5.59 5.59.9-.88zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg></button>
    <button class="icon" id="gear" aria-label="Settings" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 16.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5.67-1.5 1.5-1.5zM10.5 12c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5-1.5.67-1.5 1.5zm0-6c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5-1.5.67-1.5 1.5z"/></svg></button>
    <div class="pop hidden" id="pop" role="dialog" aria-label="Settings">
      <div class="poph">Settings</div>
      <label class="prow"><span>Personalized recommendations<small>Suggest videos based on what you watch on this device</small></span><input type="checkbox" class="sw" id="optRec" role="switch"></label>
      <button class="prow" id="optReset">Reset what Pantry learned</button>
    </div>
  </div>
</header>
<aside id="side"></aside>
<div id="scrim"></div>
<nav id="bnav" aria-label="Main">
  <button class="bn" data-home data-nav="home"><svg class="off" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 4.33l7 6.12V20h-4v-6H9v6H5v-9.55l7-6.12M12 3L4 10v11h6v-6h4v6h6V10l-8-7z"/></svg><svg class="on" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 3L3 10.2V21h6.5v-6.5h5V21H21V10.2L12 3z"/></svg><span>Home</span></button>
  <button class="bn" data-go="snacks" data-nav="snacks"><svg class="off" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="6.5" y="3" width="11" height="18" rx="3.5"/><path d="M10.5 9.2v5.6l4.2-2.8z"/></svg><svg class="on" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path fill-rule="evenodd" d="M10 3h4a3.5 3.5 0 0 1 3.5 3.5v11A3.5 3.5 0 0 1 14 21h-4a3.5 3.5 0 0 1-3.5-3.5v-11A3.5 3.5 0 0 1 10 3zm.5 6.2v5.6l4.2-2.8-4.2-2.8z"/></svg><span>Snacks</span></button>
  <button class="bn" data-go="channels" data-nav="channels"><svg class="off" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6z"/></svg><svg class="on" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M4 21c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5H4z"/></svg><span>Channels</span></button>
</nav>
<main>
  <div id="top"></div>
  <div class="grid" id="grid"></div>
  <div id="bottom"></div>
  <section class="hidden" id="watch">
    <div class="wrap">
      <div class="primary">
        <video id="player" controls playsinline></video>
        <h1 id="wTitle"></h1>
        <div class="wrow">
          <button class="avbtn" id="wAv" aria-label="Open channel"></button>
          <div><button class="chan" id="wChan"></button><div class="sub" id="wSub"></div></div>
        </div>
        <div class="desc closed" id="desc"><b id="wDate"></b><span id="wDesc"></span><div class="tags" id="wTags"></div><button class="more" id="wMore" aria-expanded="false">…more</button></div>
      </div>
      <div class="secondary" id="upnext"></div>
    </div>
  </section>
  <section class="hidden" id="snacks">
    <div id="feed"></div>
    <div class="snnav">
      <button class="icon" id="snUp" aria-label="Previous snack"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></button>
      <button class="icon" id="snDown" aria-label="Next snack"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
    </div>
  </section>
</main>

<script>
/* ===== CHANNELS =====
   id:          a short nickname (lowercase letters, numbers, dashes) that videos use to point here
   name:        shown on the channel page and under each video
   avatar:      profile picture, a file path or link (optional, otherwise the first letter is shown)
   description: shown on the channel page (optional) */
const CHANNELS = [
  { id: "3-4-film-co", name: "3/4 Film Co.", description: "", avatar: "avatars/3-4-film-co.png" },
  { id: "aidan",       name: "Aidan",        description: "I like making funny videos sometimes 💙🤗", avatar: "" }
];

/* ===== VIDEOS =====
   Copy this block for each video and put a comma between blocks:

   { title: "My first video",
     channel: "aidan",            <- the id of one of the channels above
     released: "2026-10-02",
     tags: ["funny", "peanutbutter"],   <- hashtags, without the #
     description: "What it's about.",
     url: "videos/my-first-video.mp4",
     thumbnail: "thumbnails/my-first-video.jpg" },

   Paths are relative to this file. Full web links work too. */
const VIDEOS = [
  { title: "Saving Private Ryan",
    channel: "3-4-film-co",
    released: "2026-10-02",
    tags: ["cereal", "peanutbutter", "milk"],
    description: "A short film about the mission Captain Miller goes on in order to return Private Ryan to his mother.",
    url: "videos/saving-private-ryan.mp4",
    thumbnail: "thumbnails/saving-private-ryan.jpg" },
  { title: "Buttery Love",
    channel: "aidan",
    released: "2026-09-23",
    tags: ["peanutbutter", "romance"],
    description: "funny video about a peanut butter romance lol",
    url: "videos/buttery-love.mp4",
    thumbnail: "thumbnails/buttery-love.jpg" }
];

/* ===== SNACKS (short, vertical videos) =====
   Same fields as videos. Portrait 9:16 clips look best. Copy this block for each snack:

   { title: "My first snack",
     channel: "aidan",
     released: "2026-10-04",
     tags: ["funny"],
     description: "What it's about.",
     url: "snacks/my-first-snack.mp4",
     thumbnail: "snacks/my-first-snack.jpg" },        <- thumbnail is optional

   Snacks show up in the Snacks feed, on their channel's Snacks tab, and in search. */
const SNACKS = [
  { title: "they're all just blocking the street",
    channel: "aidan",
    released: "2026-10-04",
    tags: [],
    description: "",
    url: "snacks/blocking-the-street.mp4",
    thumbnail: "snacks/blocking-the-street.jpg" }
];

const $ = id => document.getElementById(id);
/* only rewrite a section of the page if its content actually changed (keeps scroll, focus and playback untouched) */
const setHTML = (el, html) => { if (el._h !== html) { el.innerHTML = html; el._h = html; } };
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const channelById = id => CHANNELS.find(c => c.id === id) || { id, name: id, description: "", avatar: "" };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const newestFirst = (a, b) => (b.released || "").localeCompare(a.released || "");
const withIndex = () => VIDEOS.map((v, i) => ({ ...v, i }));
const countOf = id => VIDEOS.filter(v => v.channel === id).length + SNACKS.filter(v => v.channel === id).length;   /* videos + snacks */
const tagsOf = v => (v.tags || []).map(t => String(t).replace(/^#/, "").toLowerCase());

/* ---------- the "algorithm": learns from what you watch (kept in this browser only) ---------- */
const PKEY = "pantry-profile";
const SKEY = "pantry-settings";
let settings = { personalize: true };
try { settings = { ...settings, ...JSON.parse(localStorage.getItem(SKEY)) }; } catch (e) {}
const saveSettings = () => { try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch (e) {} };
const blank = () => ({ tags: {}, channels: {}, seen: {} });
let profile = blank();
try { profile = { ...blank(), ...JSON.parse(localStorage.getItem(PKEY)) }; } catch (e) {}
const saveProfile = () => { try { localStorage.setItem(PKEY, JSON.stringify(profile)); } catch (e) {} };
const vkey = v => v.channel + "/" + v.title;
const hasHistory = () => Object.keys(profile.seen).length > 0;

function record(v) {
  if (!settings.personalize) return;
  tagsOf(v).forEach(t => profile.tags[t] = (profile.tags[t] || 0) + 1);
  profile.channels[v.channel] = (profile.channels[v.channel] || 0) + 1;
  profile.seen[vkey(v)] = (profile.seen[vkey(v)] || 0) + 1;
  saveProfile();
}

/* higher score = shown earlier. `from` is the video being watched (for Up next), or null on the home page */
function score(v, from) {
  const tags = tagsOf(v);
  let s = 0;
  if (from) {
    const ft = tagsOf(from);
    s += 3 * tags.filter(t => ft.includes(t)).length;      /* shares hashtags with what you're watching */
    if (v.channel === from.channel) s += 2;                /* same channel */
  }
  if (settings.personalize) {
    s += tags.reduce((a, t) => a + Math.min(profile.tags[t] || 0, 5), 0);   /* hashtags you watch a lot */
    s += 0.5 * Math.min(profile.channels[v.channel] || 0, 5);               /* channels you watch a lot */
  }
  if (v.released) {                                                        /* newer is a little better */
    const [y, m, d] = v.released.split("-").map(Number);
    s += 2 / (1 + Math.max(0, (Date.now() - new Date(y, m - 1, d)) / 864e5) / 30);
  }
  if (settings.personalize && profile.seen[vkey(v)]) s -= 4;                       /* already watched: push down */
  return s;
}
const ranked = (list, from) => list.slice().sort((a, b) => score(b, from) - score(a, from) || newestFirst(a, b));

const avatar = c => `<span class="av">${c.avatar ? `<img src="${esc(c.avatar)}" alt="">` : esc((c.name[0] || "?").toUpperCase())}</span>`;

/* "2026-10-02" -> "October 2" (this year) or "October 2, 2025" (earlier years) */
function fmtDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-").map(Number);
  const opts = { month: "long", day: "numeric" };
  if (y !== new Date().getFullYear()) opts.year = "numeric";
  return new Date(y, m - 1, day).toLocaleDateString("en-US", opts);
}

/* "2026-09-23" -> "September 23, 2026" (always with the year) */
const fullDate = d => { if (!d) return ""; const [y, m, day] = d.split("-").map(Number); return new Date(y, m - 1, day).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }); };

/* "2026-10-02" -> "Today", "2d ago", "1w ago", "3m ago", "1y ago" (whole days only, no times) */
function ago(d, now = new Date()) {
  if (!d) return "";
  const [y, m, day] = d.split("-").map(Number);
  const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(y, m - 1, day)) / 864e5);
  if (days < 1) return "Today";
  if (days < 7) return `${days}d ago`;
  if (days < 30) return `${Math.floor(days / 7)}w ago`;
  let months = (now.getFullYear() - y) * 12 + (now.getMonth() - (m - 1)) - (now.getDate() < day ? 1 : 0);
  months = Math.max(1, months);
  return months < 12 ? `${months}m ago` : `${Math.floor(months / 12)}y ago`;
}

/* 110 -> "1:50", 3725 -> "1:02:05" */
function fmtDur(s) {
  s = Math.floor(s || 0);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
}

/* read each video's real length from the file itself */
const durCache = {};
function loadDurations() {
  document.querySelectorAll(".dur").forEach(el => {
    const i = +el.dataset.i;
    if (durCache[i] != null) { el.textContent = fmtDur(durCache[i]); return; }
    const v = document.createElement("video");
    v.preload = "metadata"; v.muted = true;
    v.onloadedmetadata = () => {
      durCache[i] = v.duration;
      document.querySelectorAll(`.dur[data-i="${i}"]`).forEach(e => e.textContent = fmtDur(v.duration));
      v.removeAttribute("src"); v.load();
    };
    v.src = VIDEOS[i].url;
  });
}

/* ---------- building blocks ---------- */
const thumb = v => `<button class="thumb" data-i="${v.i}" aria-label="Play ${esc(v.title)}">${v.thumbnail ? `<img src="${esc(v.thumbnail)}" alt="" loading="lazy">` : ""}<span class="dur" data-i="${v.i}"></span></button>`;
const byline = v => `<div class="byline"><button class="chan" data-channel="${esc(v.channel)}">${esc(channelById(v.channel).name)}</button>${v.released ? `<span>•</span><span title="${fmtDate(v.released)}">${ago(v.released)}</span>` : ""}</div>`;
const titleBtn = v => `<button class="title" data-i="${v.i}">${esc(v.title)}</button>`;

const card = v => `<article class="card">${thumb(v)}<div class="meta">
  <button class="avbtn" data-channel="${esc(v.channel)}" aria-label="${esc(channelById(v.channel).name)} channel">${avatar(channelById(v.channel))}</button>
  <div>${titleBtn(v)}${byline(v)}</div></div></article>`;

const shelfCard = v => `<article class="scard">${thumb(v)}${titleBtn(v)}<div class="byline">${v.released ? `<span title="${fmtDate(v.released)}">${ago(v.released)}</span>` : ""}</div></article>`;

const scardLg = v => shelfCard(v).replace('class="scard"', 'class="scard lg"');

const snackIdx = () => SNACKS.map((v, i) => ({ ...v, i }));
const snackCard = v => `<article class="sncard"><button class="snthumb" data-sn="${v.i}" aria-label="Play ${esc(v.title)}">${v.thumbnail ? `<img src="${esc(v.thumbnail)}" alt="" loading="lazy">` : `<span class="snph">${esc(v.title)}</span>`}</button>
  <button class="title" data-sn="${v.i}">${esc(v.title)}</button>
  <div class="byline">${v.released ? `<span title="${fmtDate(v.released)}">${ago(v.released)}</span>` : ""}</div></article>`;

const MUTE_ON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>';
const MUTE_OFF = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
const snackItem = v => { const c = channelById(v.channel); return `<section class="snack" data-s="${v.i}"><div class="frame">
  <video data-src="${esc(v.url)}" ${v.thumbnail ? `poster="${esc(v.thumbnail)}"` : ""} loop playsinline preload="none"></video>
  <button class="snmute" data-mute aria-label="Mute"></button>
  <div class="snpause"><span><svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span></div>
  <div class="snmeta">
    <div class="snrow"><button class="avbtn" data-channel="${esc(c.id)}" aria-label="${esc(c.name)} channel">${avatar(c)}</button>
      <button class="chan" data-channel="${esc(c.id)}">${esc(c.name)}</button>${v.released ? `<span>•</span><span>${ago(v.released)}</span>` : ""}</div>
    <div class="sntitle">${esc(v.title)}</div>
    ${v.description ? `<div class="sndesc">${esc(v.description)}</div>` : ""}
    ${tagsOf(v).length ? `<div class="sntags">${tagsOf(v).map(t => `<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>` : ""}
  </div>
  <div class="snbar"><i></i></div></div></section>`; };

const mini = v => `<article class="mini">${thumb(v)}<div>${titleBtn(v)}${byline(v)}</div></article>`;

const result = v => { const c = channelById(v.channel); return `<article class="res">${thumb(v)}<div class="rtxt">${titleBtn(v)}${byline(v)}
  <button class="cl" data-channel="${esc(c.id)}">${avatar(c)}${esc(c.name)}</button>
  ${v.description ? `<p class="sub">${esc(v.description)}</p>` : ""}</div></article>`; };

const channelRow = c => `<button class="chrow" data-channel="${esc(c.id)}">${avatar(c)}
  <span class="txt"><b>${esc(c.name)}</b><span class="sub">@${esc(c.id)} • ${plural(countOf(c.id), "video")}</span>
  <span class="sub">${esc(c.description || "")}</span></span></button>`;

const ICON_SNACK = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="6.5" y="3" width="11" height="18" rx="3.5"/><path d="M10.5 9.2v5.6l4.2-2.8z"/></svg>';
const ICON_HOME = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 4.33l7 6.12V20h-4v-6H9v6H5v-9.55l7-6.12M12 3L4 10v11h6v-6h4v6h6V10l-8-7z"/></svg>';

/* ---------- screens: home, channel, watch ---------- */
let view = "home", channelId = null, chip = null, chTab = "home", descOpen = false;
let curIndex = null;

function go(name, id) {
  $("player").pause();
  if (name === "snacks") { teardownFeed(); snackStart = null; }
  view = name; channelId = id || null;
  if (name === "channel") { $("q").value = ""; chTab = "home"; }
  render();
  window.scrollTo(0, 0);
}
/* ---------- snacks feed ---------- */
let feedBuilt = false, snackStart = null, snackMuted = false, activeSn = null, snObs = null;

function paintMute() {
  document.querySelectorAll(".snmute").forEach(b => { b.innerHTML = snackMuted ? MUTE_OFF : MUTE_ON; b.setAttribute("aria-label", snackMuted ? "Unmute" : "Mute"); });
}
function teardownFeed() {
  if (snObs) { snObs.disconnect(); snObs = null; }
  $("feed").querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); });
  $("feed").innerHTML = "";
  feedBuilt = false; activeSn = null;
}
const loadSn = el => { const v = el && el.querySelector("video"); if (v && !v.getAttribute("src") && v.dataset.src) v.src = v.dataset.src; };
function activate(el) {
  if (activeSn === el) return;
  $("feed").querySelectorAll("video").forEach(v => v.pause());
  activeSn = el;
  loadSn(el); loadSn(el.nextElementSibling);
  const v = el.querySelector("video");
  v.muted = snackMuted;
  const pr = v.play();
  if (pr && pr.catch) pr.catch(() => { snackMuted = true; v.muted = true; paintMute(); v.play().catch(() => {}); });
  const item = SNACKS[+el.dataset.s]; if (item) record(item);
}
function buildFeed() {
  feedBuilt = true;
  let list = ranked(snackIdx(), null);
  if (snackStart != null) { const first = list.find(x => x.i === snackStart); if (first) list = [first, ...list.filter(x => x !== first)]; }
  const feed = $("feed");
  feed.innerHTML = list.length ? list.map(snackItem).join("") : `<div class="empty">No snacks yet.</div>`;
  feed.scrollTop = 0;
  paintMute();
  const items = [...feed.querySelectorAll(".snack")];
  if (!items.length) return;
  if ("IntersectionObserver" in window) {
    snObs = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) activate(en.target); }), { root: feed, threshold: 0.6 });
    items.forEach(el => snObs.observe(el));
  } else activate(items[0]);
}
function openSnacks(i) {
  teardownFeed(); snackStart = i; view = "snacks"; channelId = null;
  render(); window.scrollTo(0, 0);
}
function snackStep(dir) {
  const items = [...$("feed").querySelectorAll(".snack")], t = items[items.indexOf(activeSn) + dir];
  if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
}
function toggleSn() {
  const v = activeSn && activeSn.querySelector("video");
  if (v) { if (v.paused) v.play().catch(() => {}); else v.pause(); }
}
function toggleMute() {
  snackMuted = !snackMuted;
  $("feed").querySelectorAll("video").forEach(v => v.muted = snackMuted);
  paintMute();
}

function goHome() { $("q").value = ""; chip = null; go("home"); }

function renderSide() {
  const homeOn = view === "home" && !$("q").value.trim() && !chip;
  setHTML($("side"), `<button class="sbtn ${homeOn ? "active" : ""}" data-home>${ICON_HOME}<span class="nm">Home</span></button>
    <button class="sbtn ${view === "snacks" ? "active" : ""}" data-go="snacks">${ICON_SNACK}<span class="nm">Snacks</span></button>
    ${CHANNELS.length ? "<h3>Channels</h3>" : ""}` +
    CHANNELS.map(c => `<button class="sbtn ${view === "channel" && channelId === c.id ? "active" : ""}" data-channel="${esc(c.id)}">${avatar(c)}<span class="nm">${esc(c.name)}</span></button>`).join(""));
}

function render() {
  const watching = view === "watch", snacking = view === "snacks";
  $("watch").classList.toggle("hidden", !watching);
  document.body.classList.toggle("watching", watching);
  if (!watching) document.body.classList.remove("drawer");
  $("top").classList.toggle("hidden", watching || snacking);
  $("grid").classList.toggle("hidden", watching || snacking);
  $("bottom").classList.toggle("hidden", watching || snacking);
  $("snacks").classList.toggle("hidden", !snacking);
  document.body.classList.toggle("snacking", snacking);
  if (!snacking && feedBuilt) teardownFeed();
  renderSide();
  document.querySelectorAll(".bn").forEach(b => b.classList.toggle("active", b.dataset.nav === (view === "channel" ? "channels" : view)));
  if (snacking) { if (!feedBuilt) buildFeed(); return; }
  if (watching) return;

  const q = $("q").value.trim().toLowerCase();
  let top = "", bottom = "", list = withIndex(), empty = "No videos yet.", asList = false, gridCls = "grid", cardFn = card;

  if (view === "channel") {
    const c = channelById(channelId);
    list = list.filter(v => v.channel === c.id);
    top = `<div class="chhead">${avatar(c)}<div><h1>${esc(c.name)}</h1>
        <div class="sub">@${esc(c.id)} • ${plural(countOf(c.id), "video")}</div>
        <p class="chdesc">${esc(c.description || "No description yet.")}</p></div></div>
      <div class="tabs">${["home", "videos"].concat(SNACKS.some(x => x.channel === c.id) ? ["snacks"] : []).map(t => `<button class="tab ${chTab === t ? "active" : ""}" data-tab="${t}">${{ home: "Home", videos: "Videos", snacks: "Snacks" }[t]}</button>`).join("")}</div>`;
    cardFn = shelfCard;
    if (chTab === "snacks") { list = snackIdx().filter(x => x.channel === c.id); cardFn = snackCard; gridCls = "grid sg"; }
    if (chTab === "home") {
      gridCls = "grid sm";
      const foryou = settings.personalize ? ranked(list, null).slice(0, 6) : [];   /* Pantry's picks from this channel */
      if (foryou.length) top += `<h2 class="shelfh">For you</h2><div class="shelf">${foryou.map(scardLg).join("")}</div>`;
      top += `<h2 class="shelfh">Videos</h2>`;
      const cs = snackIdx().filter(x => x.channel === c.id).sort(newestFirst);   /* this channel's snacks, below its videos */
      if (cs.length) bottom = `<h2 class="shelfh">Snacks</h2><div class="shelf">${cs.map(snackCard).join("")}</div>`;
    }
  } else if (view === "channels") {
    list = [];
    top = `<h2 class="shelfh" style="margin-top:16px">Channels</h2><div class="chrows">${CHANNELS.map(channelRow).join("")}</div>`;
  } else if (q) {
    asList = true; gridCls = "results"; cardFn = result;
    const tagQ = q.startsWith("#") ? q.slice(1) : null;
    const chans = tagQ ? [] : CHANNELS.filter(c => (c.name + " " + (c.description || "")).toLowerCase().includes(q));
    list = tagQ ? list.filter(v => tagsOf(v).includes(tagQ))
      : list.filter(v => (v.title + " " + channelById(v.channel).name + " " + (v.description || "") + " " + tagsOf(v).join(" ")).toLowerCase().includes(q));
    if (chans.length) top = `<div class="chrows">${chans.map(channelRow).join("")}</div>`;
    const sn = snackIdx().filter(v => tagQ ? tagsOf(v).includes(tagQ) : (v.title + " " + channelById(v.channel).name + " " + (v.description || "") + " " + tagsOf(v).join(" ")).toLowerCase().includes(q)).sort(newestFirst);
    if (sn.length) top += `<h2 class="shelfh">Snacks</h2><div class="shelf">${sn.map(snackCard).join("")}</div>`;
    empty = `No results for “${esc($("q").value.trim())}”.`;
  } else {
    const counts = {};
    VIDEOS.forEach(v => tagsOf(v).forEach(t => counts[t] = (counts[t] || 0) + 1));
    const tagList = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 8);
    const chipBtn = (key, label) => `<button class="chip ${(chip || "") === key ? "active" : ""}" data-chip="${esc(key)}">${esc(label)}</button>`;
    if (tagList.length) top = `<div class="chips">${chipBtn("", "All")}${tagList.map(t => chipBtn("t:" + t, "#" + t)).join("")}</div>`;
    if (chip) list = list.filter(v => tagsOf(v).includes(chip.slice(2)));
  }

  list = (view === "home" && !q) ? ranked(list, null) : list.sort(newestFirst);
  setHTML($("top"), top);
  setHTML($("bottom"), bottom);
  $("grid").className = gridCls;
  setHTML($("grid"), list.length ? list.map(cardFn).join("")
    : (top && (view === "channels" || (view === "home" && q)) ? "" : `<div class="empty">${empty}</div>`));
  loadDurations();
}

function renderUpNext() {
  if (curIndex == null) return;
  setHTML($("upnext"), ranked(withIndex().filter(x => x.i !== curIndex), VIDEOS[curIndex]).map(mini).join(""));
  loadDurations();
}

/* fills in the text on the watch page (never touches the player, so the video keeps playing) */
function fillWatch() {
  if (curIndex == null) return;
  const v = VIDEOS[curIndex], c = channelById(v.channel);
  setHTML($("wTags"), tagsOf(v).map(t => `<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join(""));
  $("wTitle").textContent = v.title;
  setHTML($("wAv"), avatar(c));
  $("wAv").dataset.channel = c.id;
  $("wChan").textContent = c.name;
  $("wChan").dataset.channel = c.id;
  $("wSub").textContent = plural(countOf(c.id), "video");
  $("wDate").textContent = descOpen ? fullDate(v.released) : ago(v.released);   /* exact date once expanded */
  $("desc").classList.toggle("closed", !descOpen);
  $("wMore").textContent = descOpen ? "Show less" : "…more";
  $("wMore").setAttribute("aria-expanded", String(descOpen));
  $("wDesc").textContent = v.description || "No description.";
  renderUpNext();
}

function showVideo(i, noRecord) {
  const v = VIDEOS[i], c = channelById(v.channel);
  if (!noRecord) record(v);
  curIndex = i;
  descOpen = false;
  document.body.classList.remove("drawer");
  view = "watch";
  render();
  $("player").poster = v.thumbnail || "";
  $("player").src = v.url;
  $("player").play().catch(() => {});
  fillWatch();
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-i]:not(.dur), [data-sn], [data-channel], [data-home], [data-go]")) document.body.classList.remove("msearch");
  if (e.target.closest("#wMore")) { descOpen = !descOpen; return fillWatch(); }
  if (e.target.closest("#desc.closed") && !e.target.closest("[data-tag]")) { descOpen = true; return fillWatch(); }
  if (e.target.closest("[data-mute]")) return toggleMute();
  const sn = e.target.closest("[data-sn]");
  if (sn) return openSnacks(+sn.dataset.sn);
  const gt = e.target.closest("[data-go]");
  if (gt) return go(gt.dataset.go);
  if (e.target.closest("[data-home]")) return goHome();
  const tb = e.target.closest("[data-tab]");
  if (tb) { chTab = tb.dataset.tab; return render(); }
  const tg = e.target.closest("[data-tag]");
  if (tg) { chip = null; $("q").value = "#" + tg.dataset.tag; return go("home"); }
  const ch = e.target.closest("[data-channel]");
  if (ch) return go("channel", ch.dataset.channel);
  const cp = e.target.closest("[data-chip]");
  if (cp) { chip = cp.dataset.chip || null; return render(); }
  const vid = e.target.closest("[data-i]:not(.dur)");
  if (vid) showVideo(+vid.dataset.i);
});
$("logo").onclick = goHome;
const pop = $("pop");
function closePop() { pop.classList.add("hidden"); $("gear").setAttribute("aria-expanded", "false"); }
$("gear").onclick = e => {
  e.stopPropagation();
  const opening = pop.classList.contains("hidden");
  if (opening) { $("optRec").checked = settings.personalize; $("optReset").disabled = !hasHistory(); }
  pop.classList.toggle("hidden", !opening);
  $("gear").setAttribute("aria-expanded", String(opening));
};
pop.onclick = e => e.stopPropagation();
document.addEventListener("click", closePop);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });

/* keyboard shortcuts on the watch page: F = fullscreen, Space or K = play/pause */
document.addEventListener("keydown", e => {
  if (view !== "watch" || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const key = e.key.toLowerCase();
  if (key !== "f" && key !== "k" && e.key !== " ") return;
  const t = e.target, tag = t.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || t.isContentEditable) return;   /* typing */
  const p = $("player");
  if (e.key === " " && (t === p || tag === "BUTTON" || tag === "A")) return;                        /* let the control do its own thing */
  e.preventDefault();
  if (key === "f") {
    const full = document.fullscreenElement || document.webkitFullscreenElement;
    if (full) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const go = p.requestFullscreen || p.webkitRequestFullscreen; if (go) { const r = go.call(p); if (r && r.catch) r.catch(() => {}); } }
  } else {
    if (p.paused) p.play().catch(() => {}); else p.pause();
  }
});
const refreshRecs = () => view === "watch" ? renderUpNext() : render();
$("optRec").onchange = e => { settings.personalize = e.target.checked; saveSettings(); refreshRecs(); };
$("optReset").onclick = () => { profile = blank(); saveProfile(); $("optReset").disabled = true; refreshRecs(); };
$("menu").onclick = () => document.body.classList.toggle(view === "watch" ? "drawer" : "noside");
$("scrim").onclick = () => document.body.classList.remove("drawer");
$("sbtn").onclick = () => $("q").focus();
$("snUp").onclick = () => snackStep(-1);
$("snDown").onclick = () => snackStep(1);
$("feed").onclick = e => { if (!e.target.closest("button") && e.target.closest(".snack")) toggleSn(); };
$("feed").addEventListener("timeupdate", e => {
  const v = e.target; if (v.tagName !== "VIDEO" || !v.duration) return;
  v.closest(".frame").querySelector(".snbar i").style.width = (v.currentTime / v.duration * 100) + "%";
}, true);
$("feed").addEventListener("pause", e => { const s = e.target.closest && e.target.closest(".snack"); if (s) s.classList.add("paused"); }, true);
$("feed").addEventListener("play", e => { const s = e.target.closest && e.target.closest(".snack"); if (s) s.classList.remove("paused"); }, true);
/* snacks keys: Up/Down = previous/next, Space or K = play/pause, M = mute */
document.addEventListener("keydown", e => {
  if (view !== "snacks" || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, tag = t.tagName, k = e.key.toLowerCase();
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || t.isContentEditable) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); snackStep(e.key === "ArrowDown" ? 1 : -1); }
  else if (!e.repeat && (k === "k" || (e.key === " " && tag !== "BUTTON" && tag !== "A"))) { e.preventDefault(); toggleSn(); }
  else if (!e.repeat && k === "m") toggleMute();
});
$("sicon").onclick = () => { document.body.classList.add("msearch"); $("q").focus(); };
$("sback").onclick = () => { $("q").value = ""; document.body.classList.remove("msearch"); go("home"); };
/* After every click: re-check the current screen and update only what changed (ages, recommendations, counts).
   It never changes screens, tabs, search or scroll position. */
function softRefresh() {
  const y = window.scrollY;
  const rows = [...document.querySelectorAll(".chips, .shelf")].map(el => [el.className, el.scrollLeft]);
  render();
  if (view === "watch") fillWatch();
  document.querySelectorAll(".chips, .shelf").forEach(el => { const r = rows.find(x => x[0] === el.className); if (r) el.scrollLeft = r[1]; });
  window.scrollTo(0, y);
}
document.addEventListener("click", () => setTimeout(softRefresh, 0), true);
$("q").oninput = () => { if (view !== "home") go("home"); else render(); };

render();
</script>
</body>
</html>
